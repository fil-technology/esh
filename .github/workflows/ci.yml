name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-and-verify:
    name: Test and Verify
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Select Xcode with Swift 6.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      - name: Bootstrap runtime
        run: ./scripts/bootstrap.sh

      - name: Run Swift tests
        run: swift test

      - name: Verify environment
        run: ./esh doctor

      - name: Show CLI help
        run: ./esh --help

  ios-sdk-build:
    name: iOS SDK Build Gate (clean checkout, no binary)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      # M10 #15 — proves a FRESH checkout builds the portable iOS SDK with NO machine-local dependency:
      # no Vendor/llama.xcframework, no external SSD, no symlink, no developer path, no downloaded model.
      # Deterministic: no model downloads, no Python, no Apple Foundation Models live inference (Simulator/CI
      # cannot provide FM — that is device validation, see docs/PRODUCTION_READINESS.md). EshLlamaCpp is
      # correctly absent here (no binary) and the base SDK still builds.
      - name: Build EshCore for iOS Simulator
        run: >-
          xcodebuild build -scheme EshCore
          -destination 'generic/platform=iOS Simulator' -skipPackagePluginValidation

      - name: Build EshRuntime (SDK facade) for iOS Simulator
        run: >-
          xcodebuild build -scheme EshRuntime
          -destination 'generic/platform=iOS Simulator' -skipPackagePluginValidation

  ios-embedded-integration:
    name: iOS Embedded GGUF + Clean-Room Integration
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      # Reproducible embedded llama.cpp: build the pinned xcframework from source (the build script pins the
      # upstream commit + build flags). Cached on the script's contents so it only rebuilds when the pin
      # changes. Once a release binary is published, this job can instead set ESH_LLAMA_XCFRAMEWORK_URL and
      # skip the source build (binaryTarget(url:checksum:)); either way EshLlamaCpp becomes available.
      - name: Cache pinned llama.xcframework
        id: cache-xcframework
        uses: actions/cache@v4
        with:
          path: Vendor/llama.xcframework
          key: llama-xcframework-${{ hashFiles('scripts/build-llama-xcframework.sh') }}

      - name: Build pinned llama.xcframework (macOS + iOS device + sim, Metal embedded)
        if: steps.cache-xcframework.outputs.cache-hit != 'true'
        run: ./scripts/build-llama-xcframework.sh

      - name: Install xcodegen
        run: brew install xcodegen

      # Proves the embedded GGUF backend links into an iOS app from a clean checkout.
      - name: Build EshIOSProbe integration app for iOS Simulator
        run: |
          cd Examples/EshIOSProbe
          xcodegen generate
          xcodebuild build -project EshIOSProbe.xcodeproj -scheme EshIOSProbe \
            -destination 'generic/platform=iOS Simulator' -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      # M10 #1 — clean-room consumer: a separate app that depends on esh only via its public SwiftPM
      # products and public API. Building it in CI proves the SDK integrates with no internal coupling.
      - name: Build EshCleanRoom consumer app for iOS Simulator
        run: |
          cd Examples/EshCleanRoom
          xcodegen generate
          xcodebuild build -project EshCleanRoom.xcodeproj -scheme EshCleanRoom \
            -destination 'generic/platform=iOS Simulator' -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

  package-smoke:
    name: Package Smoke Test
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Select Xcode with Swift 6.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      # Build a self-contained llama.cpp (static ggml + embedded Metal, no dlopen,
      # no Homebrew/openssl) instead of `brew install llama.cpp`, so the packaged
      # GGUF runtime is relocatable (see scripts/build-llama.sh). Cached on the
      # build script's contents (which pins the llama.cpp revision).
      - name: Cache self-contained llama.cpp
        id: cache-llama
        uses: actions/cache@v4
        with:
          path: dist/llama-build/bin
          key: llama-static-${{ runner.os }}-${{ hashFiles('scripts/build-llama.sh') }}

      - name: Build self-contained llama.cpp (static, Metal, no dlopen)
        if: steps.cache-llama.outputs.cache-hit != 'true'
        run: |
          chmod +x ./scripts/build-llama.sh
          ./scripts/build-llama.sh "$PWD/dist/llama-build/bin"

      - name: Point packaging at the bundled llama.cpp
        run: echo "ESH_LLAMA_BIN_DIR=$PWD/dist/llama-build/bin" >> "$GITHUB_ENV"

      - name: Resolve release version
        id: version
        run: |
          chmod +x ./scripts/release-version.sh
          echo "version=$(./scripts/release-version.sh show)" >> "$GITHUB_OUTPUT"

      - name: Build self-contained release package
        run: ./scripts/package-release.sh "${{ steps.version.outputs.version }}"

      - name: Smoke test packaged artifact
        run: bash ./scripts/smoke-test-package.sh "dist/esh-macos-${{ steps.version.outputs.version }}"
