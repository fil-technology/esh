name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-and-verify:
    name: Test and Verify
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Select Xcode with Swift 6.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      - name: Bootstrap runtime
        run: ./scripts/bootstrap.sh

      - name: Run Swift tests
        run: swift test

      - name: Verify environment
        run: ./esh doctor

      - name: Show CLI help
        run: ./esh --help

  ios-build:
    name: iOS Simulator Build Gate
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      # iOS regression gate for the portable runtime. Deterministic: no model downloads, no Python, no
      # Apple Foundation Models live inference (Simulator/CI cannot provide it — that is a manual/device
      # validation, see docs/IOS_M2_DEVICE_VALIDATION.md). Proves the portable core + SDK facade compile
      # for iOS. The macOS build + test suite runs in the `test-and-verify` job above.
      - name: Build EshCore for iOS Simulator
        run: >-
          xcodebuild build
          -scheme EshCore
          -destination 'generic/platform=iOS Simulator'
          -skipPackagePluginValidation

      - name: Build EshRuntime (SDK facade) for iOS Simulator
        run: >-
          xcodebuild build
          -scheme EshRuntime
          -destination 'generic/platform=iOS Simulator'
          -skipPackagePluginValidation

      - name: Install xcodegen (for the integration probe project)
        run: brew install xcodegen

      - name: Build EshIOSProbe integration app for iOS Simulator
        run: |
          cd Examples/EshIOSProbe
          xcodegen generate
          xcodebuild build \
            -project EshIOSProbe.xcodeproj \
            -scheme EshIOSProbe \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

  package-smoke:
    name: Package Smoke Test
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Select Xcode with Swift 6.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      # Build a self-contained llama.cpp (static ggml + embedded Metal, no dlopen,
      # no Homebrew/openssl) instead of `brew install llama.cpp`, so the packaged
      # GGUF runtime is relocatable (see scripts/build-llama.sh). Cached on the
      # build script's contents (which pins the llama.cpp revision).
      - name: Cache self-contained llama.cpp
        id: cache-llama
        uses: actions/cache@v4
        with:
          path: dist/llama-build/bin
          key: llama-static-${{ runner.os }}-${{ hashFiles('scripts/build-llama.sh') }}

      - name: Build self-contained llama.cpp (static, Metal, no dlopen)
        if: steps.cache-llama.outputs.cache-hit != 'true'
        run: |
          chmod +x ./scripts/build-llama.sh
          ./scripts/build-llama.sh "$PWD/dist/llama-build/bin"

      - name: Point packaging at the bundled llama.cpp
        run: echo "ESH_LLAMA_BIN_DIR=$PWD/dist/llama-build/bin" >> "$GITHUB_ENV"

      - name: Resolve release version
        id: version
        run: |
          chmod +x ./scripts/release-version.sh
          echo "version=$(./scripts/release-version.sh show)" >> "$GITHUB_OUTPUT"

      - name: Build self-contained release package
        run: ./scripts/package-release.sh "${{ steps.version.outputs.version }}"

      - name: Smoke test packaged artifact
        run: bash ./scripts/smoke-test-package.sh "dist/esh-macos-${{ steps.version.outputs.version }}"
